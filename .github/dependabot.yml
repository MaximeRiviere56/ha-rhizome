version: 2
updates:
  # Les actions sont epinglees par SHA : sans dependabot, elles resteraient
  # figees sur la version du jour.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
