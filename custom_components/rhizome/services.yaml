ajouter_plante:
  fields:
    culture_id:
      required: true
      example: tomate
      selector:
        text:
    zone:
      example: serre
      selector:
        text:
    surnom:
      example: Cœur de bœuf
      selector:
        text:
    notifs:
      default: true
      selector:
        boolean:
    echelonnement_jours:
      example: 15
      selector:
        number:
          min: 0
          max: 90
          step: 1
          # Pas d'`unit_of_measurement` : Home Assistant l'affiche telle quelle,
          # sans la traduire, alors que le libelle et la description du champ le
          # sont. La description dit deja « en jours » dans les deux langues.
          mode: box

retirer_plante:
  fields:
    uid:
      example: c3268895
      selector:
        text:
    entity_id:
      selector:
        entity:
          integration: rhizome
          domain: sensor

