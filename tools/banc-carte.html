<meta charset="utf-8">
<title>Banc d'essai — carte Lovelace</title>
<style>
  body{margin:0;padding:24px;background:#111314;font-family:system-ui;
       --rhizome-eau:#29b6f6;
       --card-background-color:#1c1f20;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;
       --primary-color:#38a3f1;--divider-color:#33393b;--error-color:#db4437;
       --text-primary-color:#fff;--ha-card-border-radius:12px;--warning-color:#ef6c00}
  .colonne{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
</style>
<div class="colonne"><div id="avec"></div><div id="sans"></div></div>
<script>
  // Doublures des elements de Home Assistant absents hors instance.
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback(){
      const titre = this.getAttribute("header");
      this.style.cssText = "display:block;background:var(--card-background-color);"
        + "border-radius:var(--ha-card-border-radius);box-shadow:0 1px 3px rgba(0,0,0,.12)";
      if (titre && !this.querySelector(".entete")) {
        const h = document.createElement("div");
        h.className = "entete";
        h.style.cssText = "padding:14px 16px;font-size:20px;font-weight:400";
        h.textContent = titre;
        this.prepend(h);
      }
    }
  });
  window.__erreurs = [];
  addEventListener("error", (e) => window.__erreurs.push(`${e.message} @ ${e.filename}:${e.lineno}`));
</script>
<script src="./fixture.js"></script>
<script type="module">
  import "../custom_components/rhizome/frontend/rhizome-card.js";

  // Le capteur tel que l'expose sensor.py, reconstitue depuis la fixture.
  const jardin = await window.__hassFactice.callWS({ type: "rhizome/jardin" });
  const etat = {
    entity_id: "sensor.rhizome_actions_a_mener",
    state: String(jardin.actions.length),
    attributes: {
      friendly_name: "Rhizome Actions à mener",
      actions: jardin.actions.map((a) => ({
        uid: a.uid, plante: a.nom, emoji: a.emoji, action: a.etape.libelle,
        etape: a.etape.type, zone: a.zone, debut: a.etape.debut, fin: a.etape.fin,
        jours_restants: a.jours_restants, en_cours: a.en_cours,
      })),
      nb_plantes: jardin.plantes.length,
    },
  };

  // Un capteur par plante, comme sensor.py les expose : c'est là que la carte
  // va chercher l'état d'arrosage de tout le potager.
  const capteursPlantes = {};
  for (const p of jardin.plantes) {
    const eau = p.arrosage || {};
    capteursPlantes["sensor.rhizome_" + p.uid] = {
      entity_id: "sensor.rhizome_" + p.uid,
      state: p.phase_libelle,
      attributes: {
        friendly_name: "Rhizome " + p.nom,
        uid: p.uid,
        culture: p.nom,
        zone: p.zone.nom,
        arrosage_concernee: !!eau.concernee,
        arrosage_a_faire: !!eau.a_arroser,
        arrosage_jours_restants: eau.jours_restants,
        arrosage_frequence_jours: eau.frequence_jours,
        arrosage_dernier: eau.dernier,
      },
    };
  }

  // La carte ne parle pas a l'integration : elle suit `hass.language`. Le banc
  // lui donne donc la langue de la fixture, pour que ses libelles et les noms
  // qu'elle lit dans les attributs soient dans la meme langue.
  const langue = jardin.langue || "fr";

  const hass = (actions) => ({
    language: langue,
    states: {
      ...capteursPlantes,
      "sensor.rhizome_actions_a_mener": actions ? etat
        : { ...etat, state: "0", attributes: { ...etat.attributes, actions: [] } },
    },
    callWS: async (msg) => { console.log("callWS", JSON.stringify(msg)); return {}; },
  });

  // La premiere carte n'a pas de titre : c'est le cas par defaut, et celui ou
  // le titre doit venir de la traduction.
  for (const [id, avecActions, vue, titre] of [
    ["avec", true, "tout", undefined],
    ["sans", false, "arrosage", "Arrosage seul"],
  ]) {
    const carte = document.createElement("rhizome-card");
    carte.setConfig(titre ? { titre, vue } : { vue });
    document.getElementById(id).appendChild(carte);
    carte.hass = hass(avecActions);
  }
  console.log("BANC CARTE: monte");
</script>
